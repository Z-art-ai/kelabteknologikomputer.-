<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Kelab Teknologi Komputer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="menu-navigasi" style="--nav-bg-img: url('images/banner-nav.jpg');">
        <div class="logo-brand">⚡ KELAB TEKNOLOGI KOMPUTER</div>
        <div class="nav-links">
            <a href="index.html" class="kotak-link">HOME</a>
            <a href="about.html" class="kotak-link">ABOUT</a>
            <a href="register.html" class="kotak-link active">REGISTER</a>
            <a href="service.html" class="kotak-link">SERVICE</a>
            <a href="contact.html" class="kotak-link">CONTACT</a>
        </div>
    </nav>

    <div class="page-transition">
        <main class="container" style="margin-top: 35px;">
            <div class="form-card">
                <div class="form-header">
                    <span class="badge">KEAHLIAN SESI 2026</span>
                    <h1>Borang Pendaftaran Ahli</h1>
                    <p>Lengkapkan butiran diri anda di bawah untuk pengesahan sistem.</p>
                </div>

                <form action="#" method="post">
                    <div class="form-group">
                        <label for="nama">Nama Pelajar:</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama penuh" maxlength="50" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="contoh@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Kata Laluan:</label>
                        <input type="password" id="password" name="password" placeholder="Minimum 8 aksara" minlength="8" required>
                    </div>

                    <div class="form-group">
                        <label>Jantina:</label>
                        <div class="option-group">
                            <label class="inline-option" for="lelaki">
                                <input type="radio" id="lelaki" name="jantina" value="lelaki" required> Lelaki
                            </label>
                            <label class="inline-option" for="perempuan">
                                <input type="radio" id="perempuan" name="jantina" value="perempuan"> Perempuan
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Hobi:</label>
                        <div class="option-group">
                            <label class="inline-option" for="membaca">
                                <input type="checkbox" id="membaca" name="hobi" value="membaca"> Membaca
                            </label>
                            <label class="inline-option" for="bersenam">
                                <input type="checkbox" id="bersenam" name="hobi" value="bersenam"> Bersenam
                            </label>
                            <label class="inline-option" for="melancong">
                                <input type="checkbox" id="melancong" name="hobi" value="melancong"> Melancong
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="kursus">Pilih Kursus:</label>
                        <select id="kursus" name="kursus" required>
                            <option value="">-- Sila Pilih Kursus --</option>
                            <option value="komputer">Teknologi Komputer</option>
                            <option value="mekanikal">Teknologi Mekanikal</option>
                            <option value="elektronik">Teknologi Elektronik</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="alamat">Alamat Rumah:</label>
                        <textarea id="alamat" name="alamat" rows="4" placeholder="Masukkan alamat rumah anda" required></textarea>
                    </div>

                    <div class="button-group">
                        <input type="submit" value="Daftar Sekarang" class="btn-submit">
                        <input type="reset" value="Padam Maklumat" class="btn-reset">
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
